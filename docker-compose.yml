services:
  postgres:
    image: postgres
    container_name: vitya-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vitya

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/posetgresql/data

volumes:
  postgres_data:
